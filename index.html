<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mapa de actores · Serrano 444</title>
<style>
/* Lienzo = hoja de papel cálida, fija en ambos temas (es la lámina que se exporta).
   Cromo de la aplicación = tokens con tema claro/oscuro. */
:root{
  --papel:#FBF6F0; --tinta:#3A2E26; --suave:#8C7E72; --linea:#DED2C4;
  --fondo:#F4EEE6; --panel:#FFFFFF; --borde:#E2D7C9;
  --acento:#C05621; --acento-claro:#D97642; --pizarra:#7E8AA4; --salvia:#6F8C85; --alerta:#B33A2B;
  --display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --texto:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --fondo:#191512; --panel:#231D18; --borde:#3A3028; --tinta:#EDE3D8; --suave:#A99A8B; --linea:#3A3028;
  --acento:#E08A4F; --acento-claro:#E8A87C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fondo:#191512; --panel:#231D18; --borde:#3A3028; --tinta:#EDE3D8; --suave:#A99A8B; --linea:#3A3028;
  --acento:#E08A4F; --acento-claro:#E8A87C; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--texto);font-size:14px}
*{box-sizing:border-box}
.app{display:flex;flex-direction:column;min-height:100%}

.barra{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--borde);background:var(--panel);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.marca{display:flex;flex-direction:column;gap:1px;min-width:0}
.marca b{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.marca span{font-size:11px;color:var(--suave);letter-spacing:.06em;text-transform:uppercase}
.pestanas{display:flex;gap:4px;flex-wrap:wrap}
.pestana{border:1px solid var(--borde);background:transparent;color:var(--suave);font-family:inherit;
  font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pestana:hover{border-color:var(--acento)}
.pestana[aria-selected="true"]{background:var(--acento);border-color:var(--acento);color:#fff}
.acciones{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--borde);background:var(--panel);color:var(--tinta);font-family:inherit;font-size:12.5px;
  padding:7px 11px;border-radius:7px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--acento)}
.btn[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff}
.btn.primario{background:var(--acento);border-color:var(--acento);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.pestana:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--acento);outline-offset:2px}
.estado-guardado{font-size:11.5px;color:var(--suave);white-space:nowrap}
.estado-guardado.err{color:var(--alerta)}

.cuerpo{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:0;flex:1;min-height:0}
.escena{position:relative;min-width:0;padding:16px;display:flex;flex-direction:column;gap:10px}
.marco{position:relative;background:#FBF6F0;border:1px solid var(--borde);border-radius:10px;overflow:hidden;
  box-shadow:0 1px 2px rgba(58,46,38,.07)}
svg#lienzo{display:block;width:100%;height:auto;max-width:100%;touch-action:none;cursor:grab}
svg#lienzo.agarrando{cursor:grabbing}
.vacio{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
  text-align:center;padding:24px;background:#FBF6F0;color:#8C7E72}
.vacio b{font-family:var(--display);font-size:19px;color:#3A2E26}
.vacio p{margin:0;max-width:34em;font-size:13px;line-height:1.55}
.pista{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--suave);min-height:20px;flex-wrap:wrap}
.pista b{color:var(--acento);font-weight:600}
.herramientas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.panel{border-left:1px solid var(--borde);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px;
  overflow:auto;min-width:0}
.bloque{display:flex;flex-direction:column;gap:8px}
.rotulo{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);font-weight:600}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:11.5px;color:var(--suave)}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:13px;color:var(--tinta);background:var(--fondo);
  border:1px solid var(--borde);border-radius:6px;padding:7px 8px}
textarea{resize:vertical;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--acento)}
.fila{display:flex;gap:8px}
.fila>*{flex:1;min-width:0}
.lista{display:flex;flex-direction:column;gap:2px;max-height:230px;overflow:auto;margin:0;padding:0;list-style:none}
.lista li{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:5px 7px;border-radius:6px;cursor:pointer;
  border:1px solid transparent}
.lista li:hover{background:var(--fondo)}
.lista li[aria-current="true"]{border-color:var(--acento);background:var(--fondo)}
.lista li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.punto{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid}
.nota-panel{font-size:11.5px;color:var(--suave);line-height:1.5;margin:0}
.sep{height:1px;background:var(--borde);border:0;margin:2px 0}
.interruptor{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--tinta);cursor:pointer}
.interruptor input{accent-color:var(--acento);width:15px;height:15px}
.marca-visor{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.logo{height:52px;width:auto;display:block;background:#FFFFFF;border-radius:6px;padding:3px 5px}
.divisor{width:1px;height:34px;background:var(--borde)}
@media (max-width:520px){ .divisor{display:none} .logo{height:36px} }
/* ---- ficha de lectura en el panel ---- */
.seg{display:flex;border:1px solid var(--borde);border-radius:8px;padding:2px;gap:2px;background:var(--fondo)}
.seg button{flex:1;border:0;background:transparent;color:var(--suave);font-family:inherit;font-size:12.5px;padding:6px 8px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--tinta);box-shadow:0 1px 2px rgba(58,46,38,.12)}
.ficha{display:flex;flex-direction:column;gap:14px;min-width:0}
.ficha-tit{font-family:var(--display);font-size:21px;line-height:1.2;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.ficha-rel{font-family:var(--display);font-style:italic;font-size:14px;color:var(--suave);margin:0;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--borde);color:var(--suave);background:var(--fondo)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sec{display:flex;flex-direction:column;gap:5px;min-width:0}
.sec h4{margin:0;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);font-weight:600}
.sec p{margin:0;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.sec .vacio-txt{color:var(--suave);font-style:italic}
.medidor{height:6px;border-radius:3px;background:var(--fondo);border:1px solid var(--borde);overflow:hidden}
.medidor b{display:block;height:100%;background:var(--acento)}
.escala{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.escala span{height:7px;border-radius:2px;background:var(--fondo);border:1px solid var(--borde)}
.escala span.on{background:var(--acento);border-color:var(--acento)}
.escala-lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--suave)}
.nivel{font-size:13px;line-height:1.45;margin:0}
.nivel b{font-weight:600}
.integrantes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.integrantes li{font-size:13px;line-height:1.4;padding-left:12px;position:relative}
.integrantes li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--acento-claro)}
.integrantes li small{color:var(--suave);font-size:11.5px}
.galeria{display:flex;flex-direction:column;gap:10px}
.galeria figure{margin:0;display:flex;flex-direction:column;gap:4px}
.galeria img{width:100%;max-width:100%;border-radius:6px;border:1px solid var(--borde);background:var(--fondo);display:block}
.galeria figcaption{font-size:11.5px;color:var(--suave);line-height:1.45}
.rel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rel button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--tinta);font-family:inherit;font-size:12.5px;padding:5px 6px;border-radius:6px;cursor:pointer;display:flex;gap:7px;align-items:center}
.rel button:hover{background:var(--fondo);border-color:var(--borde)}
.rel button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel .trazo{width:18px;height:0;border-top:2px solid;flex:none}
.edit-fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:5px;align-items:center}
.edit-img{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center}
.edit-img img{width:64px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--borde)}
.btn-mini{border:1px solid var(--borde);background:var(--panel);color:var(--suave);font-family:inherit;font-size:12px;padding:4px 8px;border-radius:6px;cursor:pointer}
.btn-mini:hover{border-color:var(--alerta);color:var(--alerta)}
.sintesis{display:flex;flex-direction:column;gap:8px}
.sintesis-fila{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.sintesis-fila .num{width:20px;height:20px;border-radius:50%;background:var(--tinta);color:var(--panel);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.sintesis-fila .num.cero{background:transparent;color:var(--suave);border:1px dashed var(--borde)}
.sintesis-fila div b{font-size:12.5px;font-weight:600;display:block}
.sintesis-fila .nombres{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sintesis-fila .nombres button{border:1px solid var(--borde);background:var(--fondo);color:var(--tinta);font-family:inherit;font-size:11.5px;padding:2px 7px;border-radius:999px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sintesis-fila .nombres button:hover{border-color:var(--acento)}
.part-n{font-size:11px;color:var(--suave);font-variant-numeric:tabular-nums;flex:none}
@media (max-width:900px){
  .cuerpo{grid-template-columns:minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--borde)}
  .escena{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- visor público ---- */
.etiqueta-proto{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--acento);border:1px solid var(--acento);border-radius:999px;padding:3px 9px;white-space:nowrap}
.marca-visor{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.logo{height:52px;width:auto;display:block;background:#FFFFFF;border-radius:6px;padding:3px 5px}
.divisor{width:1px;height:34px;background:var(--borde)}
@media (max-width:520px){ .divisor{display:none} .logo{height:36px} }
.intro-visor{display:flex;flex-direction:column;gap:8px}
.intro-visor h2{font-family:var(--display);font-size:22px;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
.intro-visor .bajada{font-family:var(--display);font-style:italic;color:var(--acento);margin:0;font-size:15px}
.intro-visor p{margin:0;font-size:13px;line-height:1.55;max-width:60ch}
.zoom{display:flex;gap:6px;align-items:center}
.lista li .part-n{margin-left:auto}
.galeria img{cursor:zoom-in}
.visor-img{position:fixed;inset:0;background:rgba(25,21,18,.86);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;cursor:zoom-out}
@media (min-width:901px){ .app{height:100%} .cuerpo{overflow:hidden} .escena{overflow:auto} }
.visor-img img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
</style>

function wrap(t,max){
  const pal=String(t||"").split(/\s+/).filter(Boolean),ls=[];let l="";
  for(const p of pal){ if(!l) l=p; else if((l+" "+p).length<=max) l+=" "+p; else {ls.push(l);l=p;} }

function hex2rgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mezcla(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);
  return "#"+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*clamp(t,0,1)).toString(16).padStart(2,"0")).join("");}

const TIPOS_IMG=["image/png","image/jpeg","image/gif","image/webp"];

function colorNodo(n){
  const t=TIPOS[n.tipo]||TIPOS.comunidad;
  const k=clamp((Number(n.r)-22)/48,0,1);
  const fill=mezcla(t.bajo,t.alto,k);
  return {fill,borde:t.borde,texto:claro(fill)?"#3A2E26":"#FFFFFF"};
}

/* ---------- geometría ---------- */
function visible(n){return verHistoricos||n.estado!=="historico";}
function borde(n,tx,ty,extra){
  const dx=tx-n.x,dy=ty-n.y,L=Math.hypot(dx,dy)||1,p=n.r+(extra||4);
  return {x:n.x+dx/L*p,y:n.y+dy/L*p};
}
function geom(v){
  const a=nodo(v.de),b=nodo(v.a); if(!a||!b)return null;
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const k=(v.curva==null?0.07:v.curva);
  const cx=(a.x+b.x)/2-uy*L*k, cy=(a.y+b.y)/2+ux*L*k;
  const p1=borde(a,cx,cy,4), p2=borde(b,cx,cy,VINCULOS[v.tipo]&&VINCULOS[v.tipo].flecha?11:4);
  const mx=0.25*p1.x+0.5*cx+0.25*p2.x, my=0.25*p1.y+0.5*cy+0.25*p2.y;
  return {p1,p2,cx,cy,mx,my,a,b};
}
function rota(px,py,cx,cy,deg){const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r),dx=px-cx,dy=py-cy;
  return {x:cx+dx*c-dy*s,y:cy+dx*s+dy*c};}

function defs(){
  let m="";
  for(const k of Object.keys(VINCULOS)){
    const v=VINCULOS[k]; if(!v.flecha)continue;
    m+=`<marker id="fl-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="${v.color}"/></marker>`;
  }
  m+=`<linearGradient id="lz-eje" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C05621"/><stop offset="1" stop-color="#7E8AA4"/></linearGradient>`;
  return `<defs>${m}</defs>`;
}

function dibZonas(){
  let m="";
  for(const z of doc.zonas){
    const s=(!exportando&&sel&&sel.k==="zona"&&sel.id===z.id);
    m+=`<g data-k="zona" data-id="${z.id}" transform="rotate(${z.rot||0} ${z.cx} ${z.cy})" style="cursor:move">`;
    m+=`<ellipse class="lz-zona" cx="${z.cx}" cy="${z.cy}" rx="${z.rx}" ry="${z.ry}"/>`;
    const lx=z.cx-z.rx*0.62, ly=z.pos==="abajo"?z.cy+z.ry*0.62:z.cy-z.ry*0.62;
    m+=`<text class="lz-zona-tit" x="${lx}" y="${ly}">${esc(z.label)}</text>`;
    if(z.sub)m+=`<text class="lz-zona-sub" x="${lx}" y="${ly+15}">${esc(String(z.sub).toUpperCase())}</text>`;
    if(s){
      m+=`<ellipse class="lz-sel" cx="${z.cx}" cy="${z.cy}" rx="${z.rx}" ry="${z.ry}"/>`;
      m+=`<rect class="lz-tir" data-k="tirX" data-id="${z.id}" x="${z.cx+z.rx-6}" y="${z.cy-6}" width="12" height="12" rx="2"/>`;
      m+=`<rect class="lz-tir" data-k="tirY" data-id="${z.id}" x="${z.cx-6}" y="${z.cy+z.ry-6}" width="12" height="12" rx="2"/>`;
      m+=`<rect class="lz-tir" data-k="tirXY" data-id="${z.id}" x="${z.cx+z.rx*0.72-6}" y="${z.cy+z.ry*0.72-6}" width="12" height="12" rx="2"/>`;
    }
    m+=`</g>`;
  }
  return m;
}

function dibVinculos(){
  let m="",lab="";
  for(const v of doc.vinculos){
    const g=geom(v); if(!g)continue;
    if(!visible(g.a)||!visible(g.b))continue;
    const d=VINCULOS[v.tipo]||VINCULOS.alianza;
    const op=(g.a.estado==="historico"||g.b.estado==="historico")?0.4:1;
    const s=(!exportando&&sel&&sel.k==="vinculo"&&sel.id===v.id);
    const dash=d.guion;
    m+=`<g data-k="vinculo" data-id="${v.id}" opacity="${op}" style="cursor:pointer">`;
    m+=`<path d="M${g.p1.x.toFixed(1)},${g.p1.y.toFixed(1)} Q${g.cx.toFixed(1)},${g.cy.toFixed(1)} ${g.p2.x.toFixed(1)},${g.p2.y.toFixed(1)}" fill="none" stroke="transparent" stroke-width="14"/>`;
    m+=`<path d="M${g.p1.x.toFixed(1)},${g.p1.y.toFixed(1)} Q${g.cx.toFixed(1)},${g.cy.toFixed(1)} ${g.p2.x.toFixed(1)},${g.p2.y.toFixed(1)}" fill="none" stroke="${s?"#C05621":d.color}" stroke-width="${s?2.6:1.5}" ${dash?`stroke-dasharray="${dash}"`:""} ${d.flecha?`marker-end="url(#fl-${v.tipo})"`:""}/>`;
    if(!verEtiquetas&&!exportando&&(v.label||v.explicacion)){
      m+=`<circle cx="${g.mx.toFixed(1)}" cy="${g.my.toFixed(1)}" r="${s?5.5:4.2}" fill="${s?"#C05621":d.color}" stroke="#FBF6F0" stroke-width="1.6"/>`;
    }
    m+=`</g>`;
    if(verEtiquetas&&v.label){
      const lx=v.lx==null?g.mx:v.lx, ly=v.ly==null?g.my-6:v.ly;
      const ls=wrap(v.label,34);
      lab+=`<g data-k="vlabel" data-id="${v.id}" opacity="${op}" style="cursor:move"><text class="lz-vlabel" x="${lx}" y="${ly}" text-anchor="middle">`;
      ls.forEach((t,i)=>{lab+=`<tspan x="${lx}" dy="${i?13:0}">${esc(t)}</tspan>`;});
      lab+=`</text></g>`;
    }
  }
  return m+lab;
}

function dibNodos(){
  let m="",notas="";
  for(const n of doc.nodos){
    if(!visible(n))continue;
    const c=colorNodo(n), op=n.estado==="historico"?0.45:1;
    const s=(!exportando&&sel&&sel.k==="nodo"&&sel.id===n.id);
    const marcado=(conectando&&desde===n.id);
    const dash="";
    m+=`<g data-k="nodo" data-id="${n.id}" opacity="${op}" style="cursor:move">`;
    m+=`<circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${c.fill}" stroke="${c.borde}" stroke-width="${n.tipo==="institucion"?1.4:1.1}" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
    const fs=clamp(n.r*0.30,9.5,15), dentro=n.r>=30;
    const maxch=dentro?Math.max(7,Math.floor((n.r*1.78)/(fs*0.52))):24;
    const ls=wrap(n.label,maxch);
    const fill=dentro?c.texto:"#5E5247";
    const y0=dentro?(n.y-(ls.length-1)*fs*0.60+fs*0.34):(n.y+n.r+fs+1);
    m+=`<text class="lz-nodo-txt" x="${n.x}" y="${y0.toFixed(1)}" font-size="${fs.toFixed(1)}" fill="${fill}" text-anchor="middle">`;
    ls.forEach((t,i)=>{m+=`<tspan x="${n.x}" dy="${i?(fs*1.18).toFixed(1):0}">${esc(t)}</tspan>`;});
    m+=`</text>`;
    const pn=verPart&&nivelPart(n.part);
    if(pn){
      const bx=n.x+n.r*0.74, by=n.y-n.r*0.74;
      m+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="9.5" fill="#3A2E26" stroke="#FBF6F0" stroke-width="1.8"/>`;
      m+=`<text x="${bx.toFixed(1)}" y="${(by+3.8).toFixed(1)}" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#FBF6F0">${pn.n}</text>`;

": 38, "significacion": "Realizó un congreso en la sede.", "tipo": "comunidad", "verif": "verificado", "x": 170, "y": 494}, {"definicion": "Las/os investigadores que han estudiado y ayudado a la comunidad del Sindicato para la reconstrucción histórica, apoyo logístico para la formulación de proyectos y la redacción de la declaratoria al CMN.", "estado": "activo", "fuente": "Acuña y López Dietz, 2017", "id": "inve", "imagenes": [], "integrantes": [{"nombre": "Ana López Dietz", "rol": "Investigadora - Historiadora"}, {"nombre": "Maria Graciela Acuña", "rol": "Investigadora - Socióloga"}], "label": "Investigadoras e historiadores", "part": "actuar", "periodo": "", "r": 30, "tipo": "investigacion", "verif": "verificado", "x": 524, "y": 533}, {"definicion": "Los alrededores del inmueble están conformados por residencias verticales que demuestran el proceso de densificación acelerada del barrio. El sector experimentó un fuerte proceso de renovación inmobiliaria con la construcción de grandes torres de departamentos de espacios reducidos", "estado": "activo", "fuente": "", "id": "veci", "imagenes": [], "integrantes": [], "label": "Vecinos y comercio del barrio Serrano", "part": "informacion", "periodo": "", "r": 18, "tipo": "comunidad", "verif": "verificado", "x": 755, "y": 230}, {"definicion": "", "estado": "activo", "fuente": "", "id": "publ", "imagenes": [], "integrantes": [], "intereses": "El Público tiene un interés en aprender sobre la historia reciente de Chile, particulamente en los tiempos de la dictadura y la resistencia obrera durante el régimen civil-militar. Principalmente, este público entró en el inmueble sabiendo que este era un Sitio de Memoria.", "label": "Público del Día de los Patrimonios", "part": "sin", "periodo": "", "r": 18, "tipo": "comunidad", "usos": "Tienen un uso esporádico del inmueble, en la medida que es una comunidad interesada por la historia detrás de este Sitio de Memoria, pero que no participa activamente de todas las actividades cotidianas del inmueble.", "verif": "porverificar", "x": 755, "y": 313}, {"estado": "historico", "fuente": "Planos Aguas Andinas; registro CBRS", "id": "prop", "imagenes": [], "integrantes": [{"nombre": "Juana Ramírez", "rol": "Primera propietaria"}, {"nombre": "Jorge Hidalgo", "rol": ""}, {"nombre": "Edmond Bannon", "rol": "Ocupó el inmueble como  Taller de Imprenta de”South Pacific Mail”."}, {"nombre": "Angelo Kovacic", "rol": "Ocupó el inmueble y lo permutó con el Sindicato Profesional de Obreros Excavadores, Alcantarilleros y de Obras Sanitarias de la Provincia de Santiago."}], "label": "Propietarios anteriores del inmueble", "periodo": "1912–1975", "r": 38, "tipo": "comunidad", "verif": "verificado", "x": 364, "y": 286}, {"definicion": "\nOrganismo técnico del Estado de Chile encargado de la protección, tuición y conservación del patrimonio cultural del país.\n", "estado": "activo", "fuente": "Decreto CMN 2016", "id": "cmn", "imagenes": [], "integrantes": [{"nombre": "Pablo Seguel Gutiérrez ", "rol": "Profesional responsable del estudio CMN"}], "intereses": "La protección legal del inmueble. Los atributos protegidos son su emplazamiento urbano y ubicación en el predio, la simplicidad de las líneas de su fachada y su altura.", "label": "Consejo de Monumentos Nacionales", "part": "soporte", "periodo": "", "r": 46, "significacion": "Particularmente, por medio de la Unidad de Sitios de Memoria, se llevó a cabo el proceso de patrimonialización de la Sede Social y Espacio de Memoria del Sindicato de Constructores y Trabajadores de la Construcción, Excavadores y Alcantarilleros en 2017-2018.", "tipo": "institucion", "verif": "porverificar", "x": 1130, "y": 300}, {"definicion": "Iniciativa webinar creada en el marco de la Exposición de \"Memorias Profundas\" en el Museo Histórico Nacional. Su página web resguarda y facilita imágenes y archivos de época del Sindicato y su sede.", "estado": "activo", "fuente": "", "id": "memo", "imagenes": [], "integrantes": [{"nombre": "Nicolás Holloway Guzmán", "rol": "Coordinador del proyecto Memorias siglo XX"}], "intereses": "Hay un interés patrimonial detrás de su actividad con el inmueble y el Sindicato. Concretamente, acompañó los encuentros de memoria que alimentaron el expediente: precedente metodológico directo.", "label": "Memorias del Siglo XX - Archivo Nacional", "part": "soporte", "periodo": "", "r": 36, "significacion": "Desde 2016 su equipo encabezó ejercicios de memoria, jornadas de recopilación de fotografías y registros audiovisuales con el sindicato, que luego formaron parte de la exposición del Museo Histórico Nacional. Nicolás Holloway, uno de los curadores, forma parte del programa.", "tipo": "institucion", "verif": "verificado", "x": 1012, "y": 447}, {"definicion": "La Municipalidad de Santiago corresponde a la institución donde se alberga el inmueble, y es aquella que resguarda que este respete la conservación del mismo. ", "estado": "activo", "fuente": "Dirección de Obras, representante legal del inmueble", "id": "muni", "imagenes": [], "integrantes": [], "label": "Municipalidad de Santiago", "part": "soporte", "periodo": "", "r": 30, "tipo": "institucion", "verif": "verificado", "x": 1104, "y": 509}, {"definicion": "El Museo Histórico Nacional es un museo estatal dependiente del Servicio Patrimonio Nacional. ", "estado": "activo", "fuente": "", "id": "mhn", "imagenes": [], "integrantes": [], "label": "Museo Histórico Nacional", "part": "consultado", "periodo": "exposición 2017–2018", "r": 26, "significacion": "Presentó la exposición «Memoria profunda: constructores del mundo sindical» entre el 22 de diciembre de 2017 y el 4 de marzo de 2018. La curaron Leonardo Mellado y Nicolás Holloway, junto con miembros del sindicato, y usó fotografías, objetos y documentos del museo y del sindicato.", "tipo": "institucion", "verif": "verificado", "x": 1010, "y": 262}, {"estado": "activo", "fuente": "", "id": "inmo", "imagenes": [], "integrantes": [], "label": "Presión inmobiliaria del eje let doc=null, sel=null, conectando=false, desde=null, exportando=false;
let vista={x:0,y:0,w:MARCO.w,h:MARCO.h}, arrastre=null;
let verEtiquetas=false, verPart=true, verHistoricos=true, verNotas=false;
const svg=document.getElementById("lienzo");
const panel=document.getElementById("panel");
const nodo=id=>doc&&doc.nodos.find(n=>n.id===id);
const zona=id=>doc&&doc.zonas.find(z=>z.id===id);
const vinc=id=>doc&&doc.vinculos.find(v=>v.id===id);
function srcImg(im){ return IMGS[im.id]||""; }
function chipTipoNodo(n){ const c=colorNodo(n); return `<span class="chip"><i style="background:${c.fill};border:1px solid ${c.borde}"></i>${esc((TIPOS[n.tipo]||TIPOS.comunidad).nombre)}</span>`; }
function chipVerif(v){ return ""; }
function secTexto(titulo,txt){ return txt&&String(txt).trim()?`<div class="sec"><h4>${titulo}</h4><p>${esc(txt)}</p></div>`:""; }
function fichaNodo(n){
  const pn=nivelPart(n.part);
  const pct=Math.round(clamp((Number(n.r)-18)/60,0,1)*100);
  let h=`<div class="ficha">
    <div class="chips">${chipTipoNodo(n)}${chipVerif(n.verif)}${n.estado==="historico"?`<span class="chip">Histórico</span>`:""}${n.periodo?`<span class="chip">${esc(n.periodo)}</span>`:""}</div>
    <h3 class="ficha-tit">${esc(n.label)}</h3>
    <div class="sec"><h4>Intensidad del vínculo con el sitio</h4><div class="medidor" role="img" aria-label="Intensidad ${pct} por ciento"><b style="width:${pct}%"></b></div></div>
    <div class="sec"><h4>Participación potencial</h4>
      <div class="escala" aria-hidden="true">${PART.filter(p=>p.n>0).map(p=>`<span class="${pn&&p.n<=pn.n?"on":""}"></span>`).join("")}</div>
      <div class="escala-lab"><span>Acceder a la información</span><span>Gestión comunitaria</span></div>
      ${pn?`<p class="nivel"><b>${pn.n} · ${esc(pn.nombre)}.</b> ${esc(pn.glosa)}</p>`:`<p class="nivel vacio-txt" style="color:var(--suave);font-style:italic">Sin nivel asignado.</p>`}
      ${!pn&&n.part_previo?`<p class="nivel" style="color:var(--alerta)">Por reasignar: en la escala anterior tenía «${esc(n.part_previo)}».</p>`:""}
      ${n.part_cond?`<p>${esc(n.part_cond)}</p>`:""}
    </div>`;
  const textos=secTexto("Definición",n.definicion)+secTexto("Significación",n.significacion)+secTexto("Intereses",n.intereses)+secTexto("Usos",n.usos);
  h+=textos||`<div class="sec"><p class="vacio-txt">Este actor todavía no tiene descripción. Usa Editar para redactar su definición, significación, intereses y usos.</p></div>`;
  const ints=(n.integrantes||[]).filter(i=>i.nombre||i.rol);
  if(ints.length){
    h+=`<div class="sec"><h4>Actores específicos · ${ints.length}</h4><ul class="integrantes">${ints.map(i=>`<li>${esc(i.nombre||"Sin nombre")}${i.rol?` <small>· ${esc(i.rol)}</small>`:""}</li>`).join("")}</ul></div>`;
  }
  const imgs=(n.imagenes||[]).filter(im=>im&&im.id);
  if(imgs.length){
    h+=`<div class="sec"><h4>Imágenes</h4><div class="galeria">${imgs.map(im=>`<figure><img src="${srcImg(im)}" alt="${esc(im.pie||n.label)}" loading="lazy">${im.pie?`<figcaption>${esc(im.pie)}</figcaption>`:""}</figure>`).join("")}</div></div>`;
  }
  const rels=doc.vinculos.filter(v=>v.de===n.id||v.a===n.id);
  if(rels.length){
    h+=`<div class="sec"><h4>Relaciones · ${rels.length}</h4><ul class="rel">${rels.map(v=>{
      const otro=nodo(v.de===n.id?v.a:v.de), d=VINCULOS[v.tipo]||VINCULOS.alianza;
      return `<li><button type="button" data-acc="ir-vinculo" data-id="${v.id}" title="${esc(d.nombre)}"><i class="trazo" style="border-color:${d.color};${d.guion?"border-top-style:dashed;":""}"></i><span>${esc(otro?otro.label:"?")}</span></button></li>`;
    }).join("")}</ul></div>`;
  }
  h+=secTexto("Fuente",n.fuente);
  return h+`</div>`;
}

function fichaVinculo(v){
  const a=nodo(v.de),b=nodo(v.a),d=VINCULOS[v.tipo]||VINCULOS.alianza;
  let h=`<div class="ficha">
    <div class="chips"><span class="chip"><i style="background:${d.color}"></i>${esc(d.nombre)}</span>${chipVerif(v.verif)}</div>
    <p class="ficha-rel">${esc(a?a.label:"?")} ${d.flecha?"→":"—"} ${esc(b?b.label:"?")}</p>`;
  if(v.label)h+=`<h3 class="ficha-tit" style="font-size:18px">${esc(v.label)}</h3>`;
  h+=v.explicacion&&v.explicacion.trim()?`<div class="sec"><h4>Explicación</h4><p>${esc(v.explicacion)}</p></div>`
    :`<div class="sec"><p class="vacio-txt">Esta relación todavía no tiene explicación. Usa Editar para redactarla.</p></div>`;
  h+=secTexto("Fuente",v.fuente);
  h+=`<div class="sec"><h4>Actores</h4><ul class="rel">${[a,b].filter(Boolean).map(x=>`<li><button type="button" data-acc="ir-nodo" data-id="${x.id}"><i class="punto" style="background:${colorNodo(x).fill};border-color:${colorNodo(x).borde}"></i><span>${esc(x.label)}</span></button></li>`).join("")}</ul></div>`;
  return h+`</div>`;
}
function sintesisPart(){
  const vis=doc.nodos.filter(visible);
  let h=`<div class="bloque"><div class="rotulo">Participación potencial</div><div class="sintesis">`;
  PART.slice().reverse().forEach(p=>{
    const ns=vis.filter(n=>n.part===p.k);
    h+=`<div class="sintesis-fila"><span class="num">${p.n}</span><div><b>${esc(p.nombre)} · ${ns.length}</b>
      ${ns.length?`<div class="nombres">${ns.map(n=>`<button type="button" data-acc="ir-nodo" data-id="${n.id}">${esc(n.label)}</button>`).join("")}</div>`:""}</div></div>`;
  });
  const sin=vis.filter(n=>!nivelPart(n.part));
  if(sin.length)h+=`<div class="sintesis-fila"><span class="num cero">–</span><div><b>Sin asignar · ${sin.length}</b><div class="nombres">${sin.map(n=>`<button type="button" data-acc="ir-nodo" data-id="${n.id}">${esc(n.label)}</button>`).join("")}</div></div></div>`;
  return h+`</div></div><hr class="sep">`;
}

function normaliza(d){
  d.zonas=d.zonas||[]; d.nodos=d.nodos||[]; d.vinculos=d.vinculos||[];
  d.nodos.forEach(n=>{ n.r=Number(n.r)||32; n.tipo=TIPOS[n.tipo]?n.tipo:"comunidad"; n.verif=VERIF[n.verif]?n.verif:"porverificar";
    if(n.part&&LEGADO[n.part])n.part=LEGADO[n.part];
    else if(n.part==="delegar"){ n.part_previo="Delegar"; n.part=""; }
    n.integrantes=Array.isArray(n.integrantes)?n.integrantes:[]; n.imagenes=Array.isArray(n.imagenes)?n.imagenes:[]; });
  return d;
}

function intro(){
  return `<div class="intro-visor">
    <div class="rotulo">Sobre este mapa</div>
    <p>Este mapa sitúa a las comunidades, instituciones y otros actores vinculados al sitio según la intensidad de su vínculo con él, las relaciones entre ellos y su participación potencial en la gestión. Es un documento de trabajo de NupatS, en revisión.</p>
    <p style="color:var(--suave)">La escala de participación potencial sigue los niveles propuestos por CRESPIAL (2020).</p>
  </div><hr class="sep">`;
}
function pintarPanel(){
  let h="";
  if(sel&&sel.k==="nodo"&&nodo(sel.id)){
    h+=`<div class="bloque"><button class="btn" type="button" data-acc="volver">← Vista general</button></div>`;
    h+=`<div class="bloque">${fichaNodo(nodo(sel.id))}</div><hr class="sep">`;
  } else if(sel&&sel.k==="vinculo"&&vinc(sel.id)){
    h+=`<div class="bloque"><button class="btn" type="button" data-acc="volver">← Vista general</button></div>`;
    h+=`<div class="bloque"><div class="rotulo">Relación</div>${fichaVinculo(vinc(sel.id))}</div><hr class="sep">`;
  } else if(sel&&sel.k==="zona"&&zona(sel.id)){
    const z=zona(sel.id);
    h+=`<div class="bloque"><button class="btn" type="button" data-acc="volver">← Vista general</button></div>`;
    h+=`<div class="bloque ficha"><div class="rotulo">Comunidad</div><h3 class="ficha-tit">${esc(z.label)}</h3>${z.sub?`<p class="ficha-rel">${esc(z.sub)}</p>`:""}</div><hr class="sep">`;
  } else {
    h+=intro()+sintesisPart();
  }
  h+=`<div class="bloque"><div class="rotulo">Actores · ${doc.nodos.filter(visible).length}</div><ul class="lista" id="listaNodos">`;
  const orden=["comunidad","institucion","mercado","investigacion"];
  doc.nodos.filter(visible).sort((a,b)=>orden.indexOf(a.tipo)-orden.indexOf(b.tipo)||b.r-a.r).forEach(n=>{
    const c=colorNodo(n), pn=nivelPart(n.part);
    h+=`<li data-id="${n.id}" tabindex="0" ${sel&&sel.k==="nodo"&&sel.id===n.id?'aria-current="true"':""}>
      <i class="punto" style="background:${c.fill};border-color:${c.borde}"></i>
      <span style="${n.estado==="historico"?"opacity:.55;":""}">${esc(n.label)}</span>${pn&&verPart?`<em class="part-n" title="Participación potencial: ${esc(pn.nombre)}">${pn.n}</em>`:""}</li>`;
  });
  h+=`</ul></div>`;
  panel.innerHTML=h; panel.scrollTop=0;
}
function render(){
  svg.setAttribute("viewBox",`${vista.x} ${vista.y} ${vista.w} ${vista.h}`);
  svg.innerHTML=lamina(); pintarPanel();
}
function encuadrar(){
  svg.setAttribute("viewBox",`0 0 ${MARCO.w} ${MARCO.h}`); svg.innerHTML=lamina();
  let b; try{ b=svg.getBBox(); }catch(e){ b=null; }
  if(!b||!b.width){ vista={x:0,y:0,w:MARCO.w,h:MARCO.h}; render(); return; }
  const m=24; vista={x:b.x-m,y:b.y-m,w:b.width+2*m,h:b.height+2*m}; render();
}

/* ---------- interacción: seleccionar y desplazar ---------- */
function aLienzo(ev){ const p=svg.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; const m=svg.getScreenCTM(); return m?p.matrixTransform(m.inverse()):{x:0,y:0}; }
svg.addEventListener("pointerdown",ev=>{
  const g=ev.target.closest("[data-k]"); const p=aLienzo(ev);
  arrastre={x0:p.x,y0:p.y,vx:vista.x,vy:vista.y,cx:ev.clientX,cy:ev.clientY,g:g?{k:g.dataset.k,id:g.dataset.id}:null,movio:false};
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove",ev=>{
  if(!arrastre)return;
  if(Math.hypot(ev.clientX-arrastre.cx,ev.clientY-arrastre.cy)>4)arrastre.movio=true;
  if(!arrastre.movio)return;
  svg.classList.add("agarrando");
  const p=aLienzo(ev); vista.x=arrastre.vx-(p.x-arrastre.x0); vista.y=arrastre.vy-(p.y-arrastre.y0);
  svg.setAttribute("viewBox",`${vista.x} ${vista.y} ${vista.w} ${vista.h}`);
});
function fin(){
  if(!arrastre)return; const a=arrastre; arrastre=null; svg.classList.remove("agarrando");
  if(a.movio)return;
  const g=a.g;
  if(!g){ sel=null; }
  else if(g.k==="nodo"||g.k==="nota") sel={k:"nodo",id:g.id};
  else if(g.k==="vinculo"||g.k==="vlabel") sel={k:"vinculo",id:g.id};
  else if(g.k==="zona") sel={k:"zona",id:g.id};
  else sel=null;
  render();
  if(sel&&window.innerWidth<=900){ try{ panel.scrollIntoView({behavior:"smooth",block:"start"}); }catch(e){} }
}
svg.addEventListener("pointerup",fin);
svg.addEventListener("pointercancel",()=>{arrastre=null;svg.classList.remove("agarrando");});
svg.addEventListener("wheel",ev=>{
  ev.preventDefault(); const p=aLienzo(ev), f=ev.deltaY>0?1.1:1/1.1;
  const w=clamp(vista.w*f,360,3600), h=w*vista.h/vista.w;
  vista.x=p.x-(p.x-vista.x)*(w/vista.w); vista.y=p.y-(p.y-vista.y)*(h/vista.h); vista.w=w; vista.h=h;
  svg.setAttribute("viewBox",`${vista.x} ${vista.y} ${vista.w} ${vista.h}`);
},{passive:false});
function zoom(f){ const cx=vista.x+vista.w/2,cy=vista.y+vista.h/2, r=vista.h/vista.w;
  vista.w=clamp(vista.w*f,360,3600); vista.h=vista.w*r; vista.x=cx-vista.w/2; vista.y=cy-vista.h/2;
  svg.setAttribute("viewBox",`${vista.x} ${vista.y} ${vista.w} ${vista.h}`); }

function elegirLista(li){ sel={k:"nodo",id:li.dataset.id}; render(); }
panel.addEventListener("click",ev=>{
  const im=ev.target.closest(".galeria img");
  if(im){ const v=document.getElementById("visorImg"); document.getElementById("visorImgEl").src=im.src; document.getElementById("visorImgEl").alt=im.alt; v.hidden=false; return; }
  const li=ev.target.closest("#listaNodos li[data-id]"); if(li){ elegirLista(li); return; }
  const b=ev.target.closest("[data-acc]"); if(!b)return;
  if(b.dataset.acc==="volver"){ sel=null; render(); return; }
  if(b.dataset.acc==="ir-nodo"){ sel={k:"nodo",id:b.dataset.id}; render(); return; }
  if(b.dataset.acc==="ir-vinculo"){ sel={k:"vinculo",id:b.dataset.id}; render(); return; }
});
panel.addEventListener("keydown",ev=>{
  const li=ev.target.closest&&ev.target.closest("#listaNodos li[data-id]");
  if(li&&(ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); elegirLista(li); }
});
document.getElementById("visorImg").addEventListener("click",e=>{e.currentTarget.hidden=true;});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"){ const v=document.getElementById("visorImg"); if(!v.hidden){v.hidden=true;return;} sel=null; render(); }
});

doc=normaliza(JSON.parse(JSON.stringify(DATOS)));
encuadrar();
})();
</script>
